name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # ✅ البوابة الحقيقية — type-check + bundle، كان دايماً نظيف طول الجلسة
      # اللي بنينا فيها هذا الـ CI، فأي فشل هنا فعلاً عطل جديد يستاهل يوقف الدمج
      - name: Build (type-check + bundle)
        run: npm run build

      # ⚠️ غير حاجب — الفرونت إند فيه اختبارات فاشلة مسبقاً (موجودة قبل إضافة
      # هذا الـ CI، مش ناتجة عنه)، فتشغيلها كبوابة حاجبة بيفشل دايماً بلا فايدة.
      # تظهر بالنتيجة عشان يُتابَع تقدمها، بدون ما توقف أي push أو PR
      - name: Run tests (non-blocking — known pre-existing failures)
        run: npm run test
        continue-on-error: true

  # ✅ CD — ينفّذ deploy.ps1 الموجود فعلياً على السيرفر، بدون أي تغيير عليه.
  # يشتغل فقط بعد نجاح build-and-test، وفقط على push حقيقي لـ main (لا PR)،
  # وفقط على الـ self-hosted runner المثبّت على سيرفر الإنتاج (deploy.ps1
  # يتحكم بخدمة Windows محلية، فلا يمكن تشغيله على runner سحابي من GitHub).
  # environment: production يفرض موافقة يدوية (Settings → Environments →
  # production → Required reviewers) قبل تنفيذ أي خطوة هنا — خط الرجعة: لو
  # صار خطأ، لا توافق، أو عطّل الـ workflow من تبويب Actions بضغطة واحدة
  deploy:
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: [self-hosted, clinicsaas-frontend]
    environment: production
    steps:
      - name: Run deploy.ps1
        shell: powershell
        run: C:\Users\Qusai\cura\deploy.ps1
